version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14
    container_name: certy_db
    restart: always
    environment:
      POSTGRES_DB: certy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - certy_network

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: certy_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=certy
      - DB_PORT=5432
      - JWT_SECRET=your_jwt_secret
      - YOOKASSA_SHOP_ID=your_shop_id
      - YOOKASSA_SECRET_KEY=your_secret_key
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - db
    networks:
      - certy_network

  # Frontend Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: certy_client
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - server
    networks:
      - certy_network

volumes:
  postgres_data:

networks:
  certy_network:
    driver: bridge