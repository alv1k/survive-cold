<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basic Certificate Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
            background-color: #f8f8f8;
        }
        .certificate {
            width: 800px;
            height: 600px;
            background: white;
            border: 5px solid #d4af37;
            position: relative;
            overflow: hidden;
        }
        .certificate::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 20px solid #f5f5f5;
            box-sizing: border-box;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        .name {
            font-size: 28px;
            color: #2c3e50;
            margin: 20px 0;
            font-weight: bold;
        }
        .event {
            font-size: 22px;
            color: #34495e;
            margin: 15px 0;
        }
        .date {
            font-size: 18px;
            color: #7f8c8d;
            margin-top: 30px;
        }
        .border-element {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .corner {
            position: absolute;
            width: 80px;
            height: 80px;
        }
        .corner-tl { top: 20px; left: 20px; border-top: 3px solid #d4af37; border-left: 3px solid #d4af37; }
        .corner-tr { top: 20px; right: 20px; border-top: 3px solid #d4af37; border-right: 3px solid #d4af37; }
        .corner-bl { bottom: 20px; left: 20px; border-bottom: 3px solid #d4af37; border-left: 3px solid #d4af37; }
        .corner-br { bottom: 20px; right: 20px; border-bottom: 3px solid #d4af37; border-right: 3px solid #d4af37; }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="border-element corner corner-tl"></div>
        <div class="border-element corner corner-tr"></div>
        <div class="border-element corner corner-bl"></div>
        <div class="border-element corner corner-br"></div>
        <div class="content">
            <div class="title">CERTIFICATE OF ACHIEVEMENT</div>
            <div class="name">[PARTICIPANT NAME]</div>
            <div class="event">is hereby awarded this certificate for successfully participating in</div>
            <div class="event">[EVENT TITLE]</div>
            <div class="date">Issued on [DATE]</div>
        </div>
    </div>
</body>
</html>
